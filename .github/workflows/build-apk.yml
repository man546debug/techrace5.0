name: Gerar APK TechRace 5.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'feature/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Testar protocolo e compilar APK
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build-output.log

      - name: Resumo da compilação
        if: always()
        run: |
          echo '### Saída da compilação' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 150 build-output.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Disponibilizar testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TechRace-V5.0-Testes
          path: |
            build-output.log
            app/build/reports/tests/testDebugUnitTest/
            app/build/dashboard-previews/
          if-no-files-found: ignore

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TechRace-V5.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
