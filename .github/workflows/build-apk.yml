name: Gerar APK TechRace 5.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'feature/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Testar protocolo e compilar APK
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build-output.log

      - name: Diagnóstico sem conteúdo do log
        if: failure()
        run: |
          python3 - <<'PYDIAG'
          from pathlib import Path
          import re
          text = Path('build-output.log').read_text(errors='replace')
          categories = {
              'DEPENDENCY_RESOLUTION': 'Could not resolve',
              'KOTLIN_COMPILATION': 'Compilation error',
              'UNIT_TEST_FAILURE': 'There were failing tests',
              'ANDROID_SDK': 'SDK location not found',
              'JITPACK_HTTP_403': 'Received status code 403',
              'JAVA_TRUST': 'PKIX path building failed',
          }
          for label, marker in categories.items():
              if marker in text:
                  print('::error title=Build category::' + label)
          # Output only filenames already published in this commit and numeric line locations.
          for filename in ['MainActivity.kt', 'ProgrammingMonitor.kt', 'MapCalibrationDisplay.kt',
                           'ProgrammingMonitorTest.kt', 'MapCalibrationDisplayTest.kt']:
              lines = re.findall(re.escape(filename) + r':(\d+):', text)
              for number in sorted(set(lines)):
                  print('::error title=Compiler location::' + filename + ':' + number)
          PYDIAG

      - name: Disponibilizar testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TechRace-V5.0-Testes
          path: |
            build-output.log
            app/build/reports/tests/testDebugUnitTest/
            app/build/dashboard-previews/
          if-no-files-found: ignore

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TechRace-V5.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
